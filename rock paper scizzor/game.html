<!DOCTYPE html>
<html>
  <head>
    <style>
body {
  background-color: rgb(201, 201, 201);
  text-align: center;
  font-family: sans-serif;
}

      button {
        padding: 8px 16px;
        font-size: 16px;
        border: 1px solid #333;
        background-color: #ddd;
        cursor: pointer;
      }

      button:hover {
        background-color: #ccc;
      }

      img {
        border: 2px solid black;
        margin: 10px;
        background: rgb(239, 255, 8);
      }

      #result {
        font-size: 20px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
<div class="page"></div>

      <button onclick="play()">Play!</button>
      <div id = "player_answer">
        You: <br />
        <img id="playerImg" width="200" />
      </div>
      <div id = "computer_answer">Computer: <br /><img id="computerImg" width="200" /></p>
      <p id="result"></p>
    </div>
    <script>
      function play() {
        let choices = ["rock", "paper", "scissors"];
        let player = choices[Math.floor(Math.random() * 3)];
        let computer = choices[Math.floor(Math.random() * 3)];

        document.getElementById("playerImg").src = player + ".png";
        document.getElementById("computerImg").src = computer + ".png";

        if (player === computer) {
          document.getElementById("result").innerText = "Tie!";
        } else if (
          (player === "rock" && computer === "scissors") ||
          (player === "paper" && computer === "rock") ||
          (player === "scissors" && computer === "paper")
        ) {
          document.getElementById("result").innerText = "You win!";
        } else {
          document.getElementById("result").innerText = "You lose!";
        }
      }
    </script>
  </body>
</html>
